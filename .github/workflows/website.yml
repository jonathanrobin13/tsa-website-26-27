name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"] # Triggers deployment when you push code to the main branch
  workflow_dispatch: # Allows you to manually trigger a build from GitHub if needed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    # 1. Tells the runner to execute all terminal actions inside the /website directory
    defaults:
      run:
        working-directory: ./website

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # 2. Directs the compiler to the correct file location to optimize installations
          cache-dependency-path: ./website/package-lock.json 

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # 3. Points the build artifact system directly to your Vite output folder
          path: './website/dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
